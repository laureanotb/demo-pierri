<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Código Pierri | Miguel Angel Pierri</title>
  <meta name="description" content="Código Pierri: el Dr. Miguel Ángel Pierri analiza los casos que marcaron a la sociedad argentina."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body{margin:0;background:#F7F4EC}
    a{color:#1B3358}
    a:hover{color:#8C7130}
  
    html{scroll-behavior:smooth}
    @keyframes fadeInUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    section { animation: fadeInUp .7s cubic-bezier(.16,1,.3,1) both; }
    section:nth-of-type(2){animation-delay:.06s}
    section:nth-of-type(3){animation-delay:.12s}
    section:nth-of-type(4){animation-delay:.18s}
    section:nth-of-type(5){animation-delay:.24s}
    section:nth-of-type(6){animation-delay:.3s}
    section:nth-of-type(n+7){animation-delay:.36s}
    a, button { transition: color .25s ease, background-color .25s ease, border-color .25s ease, opacity .25s ease, transform .18s cubic-bezier(.16,1,.3,1), box-shadow .25s ease; }
    a:active, button:active { transform: scale(0.97); }
  
    html { scroll-behavior: smooth; }
    @keyframes dcFadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes dcFadeIn { from { opacity:0; } to { opacity:1; } }
    body { animation: dcFadeIn .45s ease both; }
    section { animation: dcFadeUp .7s cubic-bezier(.16,1,.3,1) both; }
    section:nth-of-type(2) { animation-delay:.07s; }
    section:nth-of-type(3) { animation-delay:.14s; }
    section:nth-of-type(4) { animation-delay:.21s; }
    section:nth-of-type(5) { animation-delay:.28s; }
    section:nth-of-type(6) { animation-delay:.35s; }
    section:nth-of-type(n+7) { animation-delay:.42s; }
    a, button, summary, [role="button"], [style*="cursor:pointer"], [style*="cursor: pointer"] {
      transition: color .28s ease, background-color .28s ease, border-color .28s ease, opacity .28s ease, box-shadow .28s ease, transform .2s cubic-bezier(.16,1,.3,1), letter-spacing .28s ease, filter .28s ease;
    }
    a:active, button:active, [role="button"]:active, [style*="cursor:pointer"]:active { transform: scale(.975); }
    img, input, textarea, select { transition: transform .35s cubic-bezier(.16,1,.3,1), opacity .3s ease, border-color .25s ease, box-shadow .25s ease, background-color .25s ease; }
    @media (prefers-reduced-motion: reduce) {
      body, section { animation: none !important; }
      * { transition-duration: .01ms !important; }
    }
  
    body { animation: dcFadeIn .6s ease both; }
    a, button, [role="button"], [style*="cursor:pointer"], [style*="cursor: pointer"] { -webkit-tap-highlight-color: transparent; }
    a:hover, button:hover, [role="button"]:hover { transform: translateY(-1px); }
    a:active, button:active, [role="button"]:active { transform: translateY(0) scale(.978); }
  </style>
  <script src="./reveal.js"></script>
</helmet>
<div style="fontFamily:'Work Sans',sans-serif;color:#171B24;">
  <div style="position:sticky;top:0;zIndex:1000;">
    <dc-import name="Header" hint-size="100%,80px"></dc-import>
    <dc-import name="UrgenciasBar" hint-size="100%,62px"></dc-import>
  </div>

  <section style="background:#0A1220;padding:90px 32px 70px;">
    <div style="maxWidth:760px;margin:0 auto;textAlign:center;">
      <i data-lucide="clapperboard" style="width:36px;height:36px;color:#B4923F;marginBottom:14px;"></i>
      <span style="display:block;fontSize:12px;fontWeight:600;letterSpacing:2px;textTransform:uppercase;color:#B4923F;">Ciclo Editorial</span>
      <h1 style="fontFamily:'Spectral',serif;fontSize:46px;fontWeight:600;color:#F7F4EC;margin:14px 0 16px;">Código Pierri</h1>
      <p style="fontSize:15px;color:#9BA0AD;lineHeight:1.7;margin:0;">El Dr. Miguel Ángel Pierri analiza los casos que marcaron a la sociedad argentina.</p>
    </div>
  </section>

  <section style="padding:72px 32px 96px;">
    <div style="maxWidth:1000px;margin:0 auto;display:grid;gridTemplateColumns:1fr 1fr;gap:1px;background:#E4DFD3;border:1px solid #E4DFD3;">
      <sc-for list="{{ episodios }}" as="ep" hint-placeholder-count="4">
        <div style="background:#FFFFFF;display:flex;flexDirection:column;">
          <div style="height:170px;background:repeating-linear-gradient(135deg,#EDEAE0,#EDEAE0 10px,#E4DFD3 10px,#E4DFD3 20px);display:flex;alignItems:center;justifyContent:center;">
            <i data-lucide="play" style="width:30px;height:30px;color:#B4923F;"></i>
          </div>
          <div style="padding:24px;">
            <span style="fontSize:11px;fontWeight:600;letterSpacing:1px;textTransform:uppercase;color:#B4923F;">Capítulo {{ ep.n }}</span>
            <h3 style="fontFamily:'Spectral',serif;fontSize:19px;fontWeight:600;color:#0A1220;margin:8px 0 10px;">{{ ep.title }}</h3>
            <p style="fontSize:13.5px;color:#5B6270;lineHeight:1.6;margin:0;">{{ ep.text }}</p>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="background:#0A1220;padding:70px 32px;">
    <div style="maxWidth:760px;margin:0 auto;textAlign:center;">
      <h2 style="fontFamily:'Spectral',serif;fontSize:24px;fontWeight:600;color:#F7F4EC;margin:0 0 22px;">Consultá tu caso</h2>
      <a href="https://wa.me/5491138024907" target="_blank" rel="noopener" style="display:inline-flex;alignItems:center;gap:8px;background:#B4923F;color:#0A1220;padding:14px 26px;borderRadius:2px;fontSize:14px;fontWeight:600;textDecoration:none;">
        <i data-lucide="message-circle" style="width:16px;height:16px;"></i>Escribir por WhatsApp
      </a>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,380px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  episodios = [
    { n: '01', title: 'La masacre de Pompeya', text: 'Un repaso analítico de uno de los casos que marcaron a la crónica judicial argentina.' },
    { n: '02', title: 'Entrevista: a fondo con los grandes casos', text: 'El Dr. Pierri conversa sobre causas históricas y su impacto en la sociedad.' },
    { n: '03', title: 'Juicio por Jurados en debate', text: 'Análisis del sistema de Juicio por Jurados y su aplicación en Argentina.' },
    { n: '04', title: 'Casos que marcaron un antes y un después', text: 'Un recorrido por causas que cambiaron la percepción pública sobre la justicia.' }
  ];
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  componentDidUpdate() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() { return { episodios: this.episodios }; }
}

</script>
</body>
</html>
