<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @keyframes urg-pulse-bg { 0%,100% { background:#B3211F; } 50% { background:#8C1917; } }
    @keyframes urg-pulse-dot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.4; transform:scale(0.75); } }
    @keyframes urg-text-swap-a { 0%,42% { opacity:1; transform:translateY(0); } 50%,92% { opacity:0; transform:translateY(-8px); } 100% { opacity:1; transform:translateY(0); } }
    @keyframes urg-text-swap-b { 0%,42% { opacity:0; transform:translateY(8px); } 50%,92% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(8px); } }
  
    *, *::before, *::after { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
img, svg { max-width: 100%; }
    html{scroll-behavior:smooth}
    @keyframes fadeInUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    section { animation: fadeInUp .7s cubic-bezier(.16,1,.3,1) both; }
    section:nth-of-type(2){animation-delay:.06s}
    section:nth-of-type(3){animation-delay:.12s}
    section:nth-of-type(4){animation-delay:.18s}
    section:nth-of-type(5){animation-delay:.24s}
    section:nth-of-type(6){animation-delay:.3s}
    section:nth-of-type(n+7){animation-delay:.36s}
    a, button { transition: color .25s ease, background-color .25s ease, border-color .25s ease, opacity .25s ease, transform .18s cubic-bezier(.16,1,.3,1), box-shadow .25s ease; }
    a:active, button:active { transform: scale(0.97); }
  
    html { scroll-behavior: smooth; }
    @keyframes dcFadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes dcFadeIn { from { opacity:0; } to { opacity:1; } }
    body { animation: dcFadeIn .45s ease both; }
    section { animation: dcFadeUp .7s cubic-bezier(.16,1,.3,1) both; }
    section:nth-of-type(2) { animation-delay:.07s; }
    section:nth-of-type(3) { animation-delay:.14s; }
    section:nth-of-type(4) { animation-delay:.21s; }
    section:nth-of-type(5) { animation-delay:.28s; }
    section:nth-of-type(6) { animation-delay:.35s; }
    section:nth-of-type(n+7) { animation-delay:.42s; }
    a, button, summary, [role="button"], [style*="cursor:pointer"], [style*="cursor: pointer"] {
      transition: color .28s ease, background-color .28s ease, border-color .28s ease, opacity .28s ease, box-shadow .28s ease, transform .2s cubic-bezier(.16,1,.3,1), letter-spacing .28s ease, filter .28s ease;
    }
    a:active, button:active, [role="button"]:active, [style*="cursor:pointer"]:active { transform: scale(.975); }
    img, input, textarea, select { transition: transform .35s cubic-bezier(.16,1,.3,1), opacity .3s ease, border-color .25s ease, box-shadow .25s ease, background-color .25s ease; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
      body, section { animation: none !important; }
    }
  
    body { animation: dcFadeIn .6s ease both; }
    a, button, [role="button"], [style*="cursor:pointer"], [style*="cursor: pointer"] { -webkit-tap-highlight-color: transparent; }
    a:hover, button:hover, [role="button"]:hover { transform: translateY(-1px); }
    a:active, button:active, [role="button"]:active { transform: translateY(0) scale(.978); }
    a:focus-visible, button:focus-visible, [role="button"]:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
      box-shadow: 0 0 0 5px rgba(180,146,63,.25);
      border-radius: 2px;
    }
    i[data-lucide] { transition: transform .3s cubic-bezier(.16,1,.3,1); }
    a:hover i[data-lucide="arrow-right"], a:hover i[data-lucide="arrow-up-right"] { transform: translateX(4px); }
    div[style*="display:grid"] > div[style*="background:#FFFFFF"]:has(a),
    div[style*="display: grid"] > div[style*="background: rgb(255, 255, 255)"]:has(a),
    div[style*="display:grid"] > a[style*="background:#FFFFFF"],
    div[style*="display: grid"] > a[style*="background: rgb(255, 255, 255)"],
    div[style*="display:grid"] > div[style*="background:#0A1220"]:has(a),
    div[style*="display: grid"] > div[style*="background: rgb(10, 18, 32)"]:has(a) {
      transition: transform .4s cubic-bezier(.16,1,.3,1), box-shadow .4s cubic-bezier(.16,1,.3,1);
    }
    div[style*="display:grid"] > div[style*="background:#FFFFFF"]:has(a):hover,
    div[style*="display: grid"] > div[style*="background: rgb(255, 255, 255)"]:has(a):hover,
    div[style*="display:grid"] > a[style*="background:#FFFFFF"]:hover,
    div[style*="display: grid"] > a[style*="background: rgb(255, 255, 255)"]:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 44px rgba(10,18,32,0.12);
      z-index: 2;
    }
    div[style*="display:grid"] > div[style*="background:#0A1220"]:has(a):hover,
    div[style*="display: grid"] > div[style*="background: rgb(10, 18, 32)"]:has(a):hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 44px rgba(0,0,0,0.35);
      z-index: 2;
    }
    div[style*="display:grid"] > div[style*="background:#FFFFFF"]:has(a):hover i[data-lucide],
    div[style*="display: grid"] > div[style*="background: rgb(255, 255, 255)"]:has(a):hover i[data-lucide],
    div[style*="display:grid"] > a[style*="background:#FFFFFF"]:hover i[data-lucide],
    div[style*="display: grid"] > a[style*="background: rgb(255, 255, 255)"]:hover i[data-lucide],
    div[style*="display:grid"] > div[style*="background:#0A1220"]:has(a):hover i[data-lucide],
    div[style*="display: grid"] > div[style*="background: rgb(10, 18, 32)"]:has(a):hover i[data-lucide] {
      transform: scale(1.15);
    }
    a[style*="background:#B4923F"]:hover, button[style*="background:#B4923F"]:hover,
    a[style*="background: rgb(180, 146, 63)"]:hover, button[style*="background: rgb(180, 146, 63)"]:hover {
      box-shadow: 0 12px 28px rgba(180,146,63,0.32);
    }
    @media (max-width: 860px) {
      div[style*="display:grid"][style*="repeat(4,1fr)"],
      div[style*="display:grid"][style*="repeat(5,1fr)"],
      div[style*="display:grid"][style*="repeat(6,1fr)"],
      div[style*="display: grid"][style*="repeat(4, 1fr)"],
      div[style*="display: grid"][style*="repeat(5, 1fr)"],
      div[style*="display: grid"][style*="repeat(6, 1fr)"] {
        grid-template-columns: repeat(2,1fr) !important;
      }
    }
    @media (max-width: 620px) {
      div[style*="display:grid"], div[style*="display: grid"] { grid-template-columns: 1fr !important; }
      h1 { font-size: 32px !important; line-height: 1.22 !important; }
    }
    @media (max-width: 560px) {
      a[style*="urg-pulse-bg"] { gap: 10px !important; padding: 12px 16px !important; }
      span[style*="urg-text-swap-a"], span[style*="urg-text-swap-b"] { font-size: 16px !important; }
      span[style*="minWidth:220px"], span[style*="min-width: 220px"] { min-width: 190px !important; }
    }
  </style>
  <script src="./reveal.js"></script>
</helmet>
<a href="{{ waHref }}" target="_blank" rel="noopener" style="display:flex;alignItems:center;justifyContent:center;gap:14px;width:100%;boxSizing:border-box;padding:15px 20px;textDecoration:none;animation:urg-pulse-bg 1.6s ease-in-out infinite;borderBottom:1px solid rgba(0,0,0,0.25);" style-hover="filter:brightness(1.08);">
  <i data-lucide="siren" style="width:26px;height:26px;color:#FFFFFF;flexShrink:0;animation:urg-pulse-dot 1.2s ease-in-out infinite;"></i>
  <span style="position:relative;display:inline-flex;alignItems:center;justifyContent:center;height:27px;minWidth:220px;">
    <span style="position:absolute;left:0;right:0;textAlign:center;fontFamily:'Work Sans',sans-serif;fontSize:21px;fontWeight:700;letterSpacing:0.6px;color:#FFFFFF;textTransform:uppercase;whiteSpace:nowrap;animation:urg-text-swap-a 6s ease-in-out infinite;">Urgencias Penales</span>
    <span style="position:absolute;left:0;right:0;textAlign:center;fontFamily:'Work Sans',sans-serif;fontSize:21px;fontWeight:700;letterSpacing:0.3px;color:#FFFFFF;whiteSpace:nowrap;animation:urg-text-swap-b 6s ease-in-out infinite;">{{ waText }}</span>
  </span>
  <i data-lucide="message-circle" style="width:24px;height:24px;color:#FFFFFF;flexShrink:0;"></i>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:48}}">
class Component extends DCLogic {
  componentDidMount() { this.refreshIcons(); }
  componentDidUpdate() { this.refreshIcons(); }
  refreshIcons() { if (window.lucide) window.lucide.createIcons(); }

  renderVals() {
    return {
      waHref: 'https://wa.me/5491138024907',
      waText: '+54 9 11 3802-4907'
    };
  }
}
</script>
</body>
</html>
