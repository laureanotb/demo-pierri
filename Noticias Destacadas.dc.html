<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Noticias Destacadas | Miguel Angel Pierri</title>
  <meta name="description" content="Apariciones mediáticas recientes del Dr. Miguel Ángel Pierri en radio, televisión y prensa."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body{margin:0;background:#F7F4EC}
    a{color:#1B3358}
    a:hover{color:#8C7130}
  
    html{scroll-behavior:smooth}
    @keyframes fadeInUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    section { animation: fadeInUp .7s cubic-bezier(.16,1,.3,1) both; }
    section:nth-of-type(2){animation-delay:.06s}
    section:nth-of-type(3){animation-delay:.12s}
    section:nth-of-type(4){animation-delay:.18s}
    section:nth-of-type(5){animation-delay:.24s}
    section:nth-of-type(6){animation-delay:.3s}
    section:nth-of-type(n+7){animation-delay:.36s}
    a, button { transition: color .25s ease, background-color .25s ease, border-color .25s ease, opacity .25s ease, transform .18s cubic-bezier(.16,1,.3,1), box-shadow .25s ease; }
    a:active, button:active { transform: scale(0.97); }
  
    html { scroll-behavior: smooth; }
    @keyframes dcFadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes dcFadeIn { from { opacity:0; } to { opacity:1; } }
    body { animation: dcFadeIn .45s ease both; }
    section { animation: dcFadeUp .7s cubic-bezier(.16,1,.3,1) both; }
    section:nth-of-type(2) { animation-delay:.07s; }
    section:nth-of-type(3) { animation-delay:.14s; }
    section:nth-of-type(4) { animation-delay:.21s; }
    section:nth-of-type(5) { animation-delay:.28s; }
    section:nth-of-type(6) { animation-delay:.35s; }
    section:nth-of-type(n+7) { animation-delay:.42s; }
    a, button, summary, [role="button"], [style*="cursor:pointer"], [style*="cursor: pointer"] {
      transition: color .28s ease, background-color .28s ease, border-color .28s ease, opacity .28s ease, box-shadow .28s ease, transform .2s cubic-bezier(.16,1,.3,1), letter-spacing .28s ease, filter .28s ease;
    }
    a:active, button:active, [role="button"]:active, [style*="cursor:pointer"]:active { transform: scale(.975); }
    img, input, textarea, select { transition: transform .35s cubic-bezier(.16,1,.3,1), opacity .3s ease, border-color .25s ease, box-shadow .25s ease, background-color .25s ease; }
    @media (prefers-reduced-motion: reduce) {
      body, section { animation: none !important; }
      * { transition-duration: .01ms !important; }
    }
  
    body { animation: dcFadeIn .6s ease both; }
    a, button, [role="button"], [style*="cursor:pointer"], [style*="cursor: pointer"] { -webkit-tap-highlight-color: transparent; }
    a:hover, button:hover, [role="button"]:hover { transform: translateY(-1px); }
    a:active, button:active, [role="button"]:active { transform: translateY(0) scale(.978); }
  </style>
  <script src="./reveal.js"></script>
</helmet>
<div style="fontFamily:'Work Sans',sans-serif;color:#171B24;">
  <div style="position:sticky;top:0;zIndex:1000;">
    <dc-import name="Header" hint-size="100%,80px"></dc-import>
    <dc-import name="UrgenciasBar" hint-size="100%,62px"></dc-import>
  </div>

  <section style="background:#0A1220;padding:90px 32px 70px;">
    <div style="maxWidth:760px;margin:0 auto;textAlign:center;">
      <i data-lucide="newspaper" style="width:36px;height:36px;color:#B4923F;marginBottom:14px;"></i>
      <span style="display:block;fontSize:12px;fontWeight:600;letterSpacing:2px;textTransform:uppercase;color:#B4923F;">Prensa</span>
      <h1 style="fontFamily:'Spectral',serif;fontSize:46px;fontWeight:600;color:#F7F4EC;margin:14px 0 16px;">Noticias Destacadas</h1>
      <p style="fontSize:15px;color:#9BA0AD;lineHeight:1.7;margin:0;">Apariciones recientes del Dr. Pierri en radio, televisión y prensa escrita.</p>
    </div>
  </section>

  <section style="padding:72px 32px 40px;">
    <div style="maxWidth:800px;margin:0 auto;display:flex;flexDirection:column;">
      <sc-for list="{{ visibles }}" as="n" hint-placeholder-count="6">
        <div style="display:flex;justifyContent:space-between;gap:24px;padding:26px 4px;borderBottom:1px solid #E4DFD3;">
          <i data-lucide="{{ n.icon }}" style="width:22px;height:22px;color:#B4923F;flexShrink:0;"></i>
          <div style="flex:1;">
            <span style="fontSize:11px;fontWeight:600;letterSpacing:1px;textTransform:uppercase;color:#B4923F;">{{ n.fuente }} · {{ n.fecha }}</span>
            <h3 style="fontFamily:'Spectral',serif;fontSize:18px;fontWeight:600;color:#0A1220;margin:8px 0 8px;">{{ n.title }}</h3>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="padding:0 32px 96px;">
    <div style="maxWidth:800px;margin:0 auto;display:flex;justifyContent:center;gap:10px;">
      <sc-if value="{{ hasMore }}">
        <button onClick="{{ loadMore }}" style="background:#0A1220;color:#F7F4EC;border:none;padding:12px 26px;borderRadius:2px;fontSize:13.5px;fontWeight:600;cursor:pointer;fontFamily:'Work Sans',sans-serif;">Ver más noticias</button>
      </sc-if>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,380px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { visible: 4 };
  noticias = [
    { title: 'Entrevista sobre el desarrollo del juicio por el caso Báez Sosa', fuente: 'TV', fecha: '2023' },
    { title: 'Análisis de la causa Generación Zoe en radio', fuente: 'Radio', fecha: '2022' },
    { title: 'Nota sobre Juicio por Jurados y su implementación', fuente: 'Prensa escrita', fecha: '2022' },
    { title: 'Cobertura del caso "El Pepo" en programa de actualidad', fuente: 'TV', fecha: '2021' },
    { title: 'Entrevista sobre defensa de futbolistas extranjeros', fuente: 'Radio', fecha: '2021' },
    { title: 'Participación en panel sobre delitos informáticos', fuente: 'TV', fecha: '2020' },
    { title: 'Nota sobre el ciclo Código Pierri', fuente: 'Prensa escrita', fecha: '2020' },
    { title: 'Análisis del caso "Los Monos" en radio', fuente: 'Radio', fecha: '2019' }
  ];
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  componentDidUpdate() { if (window.lucide) window.lucide.createIcons(); }
  fuenteIcon = { TV: 'tv', Radio: 'radio', 'Prensa escrita': 'newspaper' };

  renderVals() {
    const visibles = this.noticias.slice(0, this.state.visible).map(n => ({ ...n, icon: this.fuenteIcon[n.fuente] || 'newspaper' }));
    return {
      visibles,
      hasMore: this.state.visible < this.noticias.length,
      loadMore: () => this.setState(s => ({ visible: s.visible + 4 }))
    };
  }
}

</script>
</body>
</html>
