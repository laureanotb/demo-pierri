<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Área Lectura | Miguel Angel Pierri</title>
  <meta name="description" content="Hemeroteca del Estudio Miguel Ángel Pierri &amp; Abogados: notas y artículos organizados por caso."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body{margin:0;background:#F7F4EC}
    a{color:#1B3358}
    a:hover{color:#8C7130}
  
    html{scroll-behavior:smooth}
    @keyframes fadeInUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    section { animation: fadeInUp .7s cubic-bezier(.16,1,.3,1) both; }
    section:nth-of-type(2){animation-delay:.06s}
    section:nth-of-type(3){animation-delay:.12s}
    section:nth-of-type(4){animation-delay:.18s}
    section:nth-of-type(5){animation-delay:.24s}
    section:nth-of-type(6){animation-delay:.3s}
    section:nth-of-type(n+7){animation-delay:.36s}
    a, button { transition: color .25s ease, background-color .25s ease, border-color .25s ease, opacity .25s ease, transform .18s cubic-bezier(.16,1,.3,1), box-shadow .25s ease; }
    a:active, button:active { transform: scale(0.97); }
  
    html { scroll-behavior: smooth; }
    @keyframes dcFadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes dcFadeIn { from { opacity:0; } to { opacity:1; } }
    body { animation: dcFadeIn .45s ease both; }
    section { animation: dcFadeUp .7s cubic-bezier(.16,1,.3,1) both; }
    section:nth-of-type(2) { animation-delay:.07s; }
    section:nth-of-type(3) { animation-delay:.14s; }
    section:nth-of-type(4) { animation-delay:.21s; }
    section:nth-of-type(5) { animation-delay:.28s; }
    section:nth-of-type(6) { animation-delay:.35s; }
    section:nth-of-type(n+7) { animation-delay:.42s; }
    a, button, summary, [role="button"], [style*="cursor:pointer"], [style*="cursor: pointer"] {
      transition: color .28s ease, background-color .28s ease, border-color .28s ease, opacity .28s ease, box-shadow .28s ease, transform .2s cubic-bezier(.16,1,.3,1), letter-spacing .28s ease, filter .28s ease;
    }
    a:active, button:active, [role="button"]:active, [style*="cursor:pointer"]:active { transform: scale(.975); }
    img, input, textarea, select { transition: transform .35s cubic-bezier(.16,1,.3,1), opacity .3s ease, border-color .25s ease, box-shadow .25s ease, background-color .25s ease; }
    @media (prefers-reduced-motion: reduce) {
      body, section { animation: none !important; }
      * { transition-duration: .01ms !important; }
    }
  
    body { animation: dcFadeIn .6s ease both; }
    a, button, [role="button"], [style*="cursor:pointer"], [style*="cursor: pointer"] { -webkit-tap-highlight-color: transparent; }
    a:hover, button:hover, [role="button"]:hover { transform: translateY(-1px); }
    a:active, button:active, [role="button"]:active { transform: translateY(0) scale(.978); }
  </style>
  <script src="./reveal.js"></script>
</helmet>
<div style="fontFamily:'Work Sans',sans-serif;color:#171B24;">
  <div style="position:sticky;top:0;zIndex:1000;">
    <dc-import name="Header" hint-size="100%,80px"></dc-import>
    <dc-import name="UrgenciasBar" hint-size="100%,62px"></dc-import>
  </div>

  <section style="background:#0A1220;padding:90px 32px 70px;">
    <div style="maxWidth:760px;margin:0 auto;textAlign:center;">
      <i data-lucide="library" style="width:36px;height:36px;color:#B4923F;marginBottom:14px;"></i>
      <span style="display:block;fontSize:12px;fontWeight:600;letterSpacing:2px;textTransform:uppercase;color:#B4923F;">Hemeroteca</span>
      <h1 style="fontFamily:'Spectral',serif;fontSize:46px;fontWeight:600;color:#F7F4EC;margin:14px 0 16px;">Área Lectura</h1>
      <p style="fontSize:15px;color:#9BA0AD;lineHeight:1.7;margin:0;">Archivo de notas y artículos organizados por caso.</p>
    </div>
  </section>

  <section style="padding:72px 32px 40px;">
    <div style="maxWidth:900px;margin:0 auto;display:flex;flexDirection:column;gap:44px;">
      <sc-for list="{{ carpetas }}" as="carpeta" hint-placeholder-count="3">
        <div>
          <h2 style="fontFamily:'Spectral',serif;fontSize:20px;fontWeight:600;color:#0A1220;borderBottom:1px solid #E4DFD3;paddingBottom:12px;margin:0 0 4px;display:flex;alignItems:center;gap:10px;"><i data-lucide="folder-open" style="width:18px;height:18px;color:#B4923F;"></i>{{ carpeta.name }}</h2>
          <sc-for list="{{ carpeta.notas }}" as="nota" hint-placeholder-count="3">
            <div style="display:flex;justifyContent:space-between;alignItems:center;gap:16px;padding:15px 4px;borderBottom:1px solid #EDEAE0;">
              <span style="fontSize:14px;color:#171B24;">{{ nota }}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="padding:0 32px 96px;">
    <div style="maxWidth:900px;margin:0 auto;display:flex;justifyContent:center;gap:8px;">
      <sc-for list="{{ paginas }}" as="p" hint-placeholder-count="3">
        <button onClick="{{ p.select }}" style="width:36px;height:36px;border:1px solid {{ p.borderColor }};background:{{ p.bg }};color:{{ p.color }};borderRadius:2px;fontSize:13px;fontWeight:600;cursor:pointer;fontFamily:'Work Sans',sans-serif;">{{ p.n }}</button>
      </sc-for>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,380px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { pagina: 1 };
  carpetas = [
    { name: 'Noticias Caso Rubén Fangio', notas: ['Cobertura inicial del caso', 'Seguimiento del proceso judicial', 'Repercusión mediática del fallo'] },
    { name: 'Noticias Caso Cardona y Barrios', notas: ['El sobreseimiento de los futbolistas colombianos', 'Análisis de la causa penal internacional', 'Repercusión en medios deportivos'] },
    { name: 'Noticias Generales', notas: ['Entrevistas al Dr. Pierri sobre distintas causas', 'Notas de opinión sobre el sistema penal', 'Participación en jornadas académicas'] }
  ];
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  componentDidUpdate() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() {
    const total = 3;
    const paginas = Array.from({ length: total }, (_, i) => {
      const n = i + 1;
      const active = this.state.pagina === n;
      return {
        n, select: () => this.setState({ pagina: n }),
        bg: active ? '#0A1220' : '#FFFFFF',
        color: active ? '#F7F4EC' : '#0A1220',
        borderColor: active ? '#0A1220' : '#D8D2C2'
      };
    });
    return { carpetas: this.carpetas, paginas };
  }
}

</script>
</body>
</html>
