<helmet>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>

    a{color:#1B3358}
    a:hover{color:#8C7130}
  
    *, *::before, *::after { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
img, svg { max-width: 100%; }
    html{scroll-behavior:smooth}
    @keyframes fadeInUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }

    @keyframes dcFadeIn { from { opacity:0; } to { opacity:1; } }

    section:nth-of-type(3) { animation-delay:.14s; }

    a, button, summary, [role="button"], [style*="cursor:pointer"], [style*="cursor: pointer"] {
      transition: color .28s ease, background-color .28s ease, border-color .28s ease, opacity .28s ease, box-shadow .28s ease, transform .2s cubic-bezier(.16,1,.3,1), letter-spacing .28s ease, filter .28s ease;

      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
      body, section { animation: none !important; }

    body { animation: dcFadeIn .6s ease both; }
    a, button, [role="button"], [style*="cursor:pointer"], [style*="cursor: pointer"] { -webkit-tap-highlight-color: transparent; }
    a:hover, button:hover, [role="button"]:hover { transform: translateY(-1px); }
    a:active, button:active, [role="button"]:active { transform: translateY(0) scale(.978); }
    a:focus-visible, button:focus-visible, [role="button"]:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
      box-shadow: 0 0 0 5px rgba(180,146,63,.25);
      border-radius: 2px;
    }
    i[data-lucide] { transition: transform .3s cubic-bezier(.16,1,.3,1); }
    a:hover i[data-lucide="arrow-right"], a:hover i[data-lucide="arrow-up-right"] { transform: translateX(4px); }
    div[style*="display:grid"] > div[style*="background:#FFFFFF"]:has(a),
    div[style*="display: grid"] > div[style*="background: rgb(255, 255, 255)"]:has(a),
    div[style*="display:grid"] > a[style*="background:#FFFFFF"],
    div[style*="display: grid"] > a[style*="background: rgb(255, 255, 255)"],
    div[style*="display:grid"] > div[style*="background:#0A1220"]:has(a),
    div[style*="display: grid"] > div[style*="background: rgb(10, 18, 32)"]:has(a) {
      transition: transform .4s cubic-bezier(.16,1,.3,1), box-shadow .4s cubic-bezier(.16,1,.3,1);

    div[style*="display:grid"] > div[style*="background:#FFFFFF"]:has(a):hover,
    div[style*="display: grid"] > div[style*="background: rgb(255, 255, 255)"]:has(a):hover,
    div[style*="display:grid"] > a[style*="background:#FFFFFF"]:hover,
    div[style*="display: grid"] > a[style*="background: rgb(255, 255, 255)"]:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 44px rgba(10,18,32,0.12);
      z-index: 2;
    }
    div[style*="display:grid"] > div[style*="background:#0A1220"]:has(a):hover,
    div[style*="display: grid"] > div[style*="background: rgb(10, 18, 32)"]:has(a):hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 44px rgba(0,0,0,0.35);
      z-index: 2;
    }
    div[style*="display:grid"] > div[style*="background:#FFFFFF"]:has(a):hover i[data-lucide],
    div[style*="display: grid"] > div[style*="background: rgb(255, 255, 255)"]:has(a):hover i[data-lucide],
    div[style*="display:grid"] > a[style*="background:#FFFFFF"]:hover i[data-lucide],
    div[style*="display: grid"] > a[style*="background: rgb(255, 255, 255)"]:hover i[data-lucide],
    div[style*="display:grid"] > div[style*="background:#0A1220"]:has(a):hover i[data-lucide],
    div[style*="display: grid"] > div[style*="background: rgb(10, 18, 32)"]:has(a):hover i[data-lucide] {
      transform: scale(1.15);

    a[style*="background: rgb(180, 146, 63)"]:hover, button[style*="background: rgb(180, 146, 63)"]:hover {
      box-shadow: 0 12px 28px rgba(180,146,63,0.32);
    }

    /* Stagger reveal on card grids: reuses reveal.js's inline transition, only adds a per-item delay */
    div[style*="display:grid"] > *:nth-child(2), div[style*="display: grid"] > *:nth-child(2) { transition-delay: .05s !important; }
    div[style*="display:grid"] > *:nth-child(3), div[style*="display: grid"] > *:nth-child(3) { transition-delay: .1s !important; }
    div[style*="display:grid"] > *:nth-child(4), div[style*="display: grid"] > *:nth-child(4) { transition-delay: .15s !important; }
    div[style*="display:grid"] > *:nth-child(5), div[style*="display: grid"] > *:nth-child(5) { transition-delay: .2s !important; }
    div[style*="display:grid"] > *:nth-child(6), div[style*="display: grid"] > *:nth-child(6) { transition-delay: .25s !important; }
    div[style*="display:grid"] > *:nth-child(7), div[style*="display: grid"] > *:nth-child(7) { transition-delay: .3s !important; }
    div[style*="display:grid"] > *:nth-child(8), div[style*="display: grid"] > *:nth-child(8) { transition-delay: .35s !important; }
    div[style*="display:grid"] > *:nth-child(9), div[style*="display: grid"] > *:nth-child(9) { transition-delay: .4s !important; }
    div[style*="display:grid"] > *:nth-child(10), div[style*="display: grid"] > *:nth-child(10) { transition-delay: .45s !important; }
    /* Stronger touch feedback on primary (bronze) buttons/links */
    a[style*="background:#B4923F"]:active, button[style*="background:#B4923F"]:active,
    a[style*="background: rgb(180, 146, 63)"]:active, button[style*="background: rgb(180, 146, 63)"]:active {
      filter: brightness(0.9);
    }
    @media (max-width: 860px) {

      div[style*="display:grid"][style*="repeat(5,1fr)"],
      div[style*="display:grid"][style*="repeat(6,1fr)"],
      div[style*="display: grid"][style*="repeat(4, 1fr)"],
      div[style*="display: grid"][style*="repeat(5, 1fr)"],
      div[style*="display: grid"][style*="repeat(6, 1fr)"] {
        grid-template-columns: repeat(2,1fr) !important;
      }
    }
    @media (max-width: 620px) {
      div[style*="display:grid"], div[style*="display: grid"] { grid-template-columns: 1fr !important; }
      h1 { font-size: 32px !important; line-height: 1.22 !important; }
    }
  </style>
  <script src="./reveal.js"></script>
</helmet>
<div style="fontFamily:'Work Sans',sans-serif;color:#171B24;">
  <div style="position:sticky;top:0;zIndex:1000;">
    <dc-import name="Header" hint-size="100%,80px"></dc-import>
    <dc-import name="UrgenciasBar" hint-size="100%,62px"></dc-import>
  </div>

  <section style="background:#0A1220;padding:90px 32px 70px;">
    <div style="maxWidth:760px;margin:0 auto;textAlign:center;">
      <i data-lucide="library" style="width:36px;height:36px;color:#B4923F;marginBottom:14px;"></i>
      <span style="display:block;fontSize:12px;fontWeight:600;letterSpacing:2px;textTransform:uppercase;color:#B4923F;">Hemeroteca</span>
      <h1 style="fontFamily:'Spectral',serif;fontSize:46px;fontWeight:600;color:#F7F4EC;margin:14px 0 16px;">Área Lectura</h1>
      <p style="fontSize:15px;color:#9BA0AD;lineHeight:1.7;margin:0;">Archivo de notas y artículos organizados por caso.</p>
    </div>
  </section>

  <section style="padding:72px 32px 40px;">
    <div style="maxWidth:900px;margin:0 auto;display:flex;flexDirection:column;gap:44px;">
      <sc-for list="{{ carpetas }}" as="carpeta" hint-placeholder-count="3">
        <div>
          <h2 style="fontFamily:'Spectral',serif;fontSize:20px;fontWeight:600;color:#0A1220;borderBottom:1px solid #E4DFD3;paddingBottom:12px;margin:0 0 4px;display:flex;alignItems:center;gap:10px;"><i data-lucide="folder-open" style="width:18px;height:18px;color:#B4923F;"></i>{{ carpeta.name }}</h2>
          <sc-for list="{{ carpeta.notas }}" as="nota" hint-placeholder-count="3">
            <div style="display:flex;justifyContent:space-between;alignItems:center;gap:16px;padding:15px 4px;borderBottom:1px solid #EDEAE0;">
              <span style="fontSize:14px;color:#171B24;">{{ nota }}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="padding:0 32px 96px;">
    <div style="maxWidth:900px;margin:0 auto;display:flex;justifyContent:center;gap:8px;">
      <sc-for list="{{ paginas }}" as="p" hint-placeholder-count="3">
        <button onClick="{{ p.select }}" style="width:36px;height:36px;border:1px solid {{ p.borderColor }};background:{{ p.bg }};color:{{ p.color }};borderRadius:2px;fontSize:13px;fontWeight:600;cursor:pointer;fontFamily:'Work Sans',sans-serif;">{{ p.n }}</button>
      </sc-for>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,380px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { pagina: 1 };
  carpetas = [
    { name: 'Noticias Caso Rubén Fangio', notas: ['Cobertura inicial del caso', 'Seguimiento del proceso judicial', 'Repercusión mediática del fallo'] },
    { name: 'Noticias Caso Cardona y Barrios', notas: ['El sobreseimiento de los futbolistas colombianos', 'Análisis de la causa penal internacional', 'Repercusión en medios deportivos'] },
    { name: 'Noticias Generales', notas: ['Entrevistas al Dr. Pierri sobre distintas causas', 'Notas de opinión sobre el sistema penal', 'Participación en jornadas académicas'] }
  ];
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  componentDidUpdate() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() {
    const total = 3;
    const paginas = Array.from({ length: total }, (_, i) => {
      const n = i + 1;
      const active = this.state.pagina === n;
      return {
        n, select: () => this.setState({ pagina: n }),
        bg: active ? '#0A1220' : '#FFFFFF',
        color: active ? '#F7F4EC' : '#0A1220',
        borderColor: active ? '#0A1220' : '#D8D2C2'
      };
    });
    return { carpetas: this.carpetas, paginas };
  }
}

</script>
