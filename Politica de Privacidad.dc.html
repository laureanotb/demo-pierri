<div style="fontFamily:'Work Sans',sans-serif;color:#171B24;">
  <div style="position:sticky;top:0;zIndex:1000;">
    <dc-import name="Header" hint-size="100%,80px"></dc-import>
    <dc-import name="UrgenciasBar" hint-size="100%,62px"></dc-import>
  </div>

  <section style="background:#0A1220;padding:80px 32px 56px;">
    <div style="maxWidth:760px;margin:0 auto;">
      <div style="display:flex;alignItems:center;gap:14px;">
        <i data-lucide="shield-check" style="width:30px;height:30px;color:#B4923F;"></i>
        <h1 style="fontFamily:'Spectral',serif;fontSize:38px;fontWeight:600;color:#F7F4EC;margin:0;">Política de privacidad</h1>

    </div>
  </section>

  <section style="padding:64px 32px 96px;">
    <div style="maxWidth:760px;margin:0 auto;display:flex;flexDirection:column;gap:36px;">
      <sc-for list="{{ secciones }}" as="sec" hint-placeholder-count="5">
        <div>
          <h2 style="fontFamily:'Spectral',serif;fontSize:19px;fontWeight:600;color:#0A1220;margin:0 0 12px;display:flex;alignItems:center;gap:10px;"><i data-lucide="{{ sec.icon }}" style="width:18px;height:18px;color:#B4923F;"></i>{{ sec.title }}</h2>

        </div>
      </sc-for>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,380px"></dc-import>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  secciones = [
    { title: 'Comentarios', icon: 'message-square', text: 'Cuando un visitante deja un comentario en el sitio, recopilamos los datos mostrados en el formulario de comentarios, así como la dirección IP del visitante y la cadena de agente de usuario del navegador para ayudar a la detección de spam.' },
    { title: 'Multimedia', icon: 'image', text: 'Si subís imágenes al sitio, evitá subir imágenes con datos de ubicación (EXIF GPS) incluidos. Los visitantes del sitio pueden descargar y extraer datos de ubicación de las imágenes disponibles en el sitio.' },
    { title: 'Cookies', icon: 'cookie', text: 'Si dejás un comentario en nuestro sitio, podés optar por guardar tu nombre, correo electrónico y sitio web en cookies. Estas cookies son para tu comodidad, de modo que no tengas que completar tus datos nuevamente. Al visitar la página, podemos instalar cookies técnicas y de análisis para mejorar la experiencia de navegación.' },
    { title: 'Contenido embebido de otros sitios', icon: 'link', text: 'Los artículos de este sitio pueden incluir contenido embebido (por ejemplo, videos, imágenes, notas de prensa, etc.). El contenido embebido de otros sitios web se comporta exactamente de la misma manera que si el visitante hubiera visitado el sitio web de origen, el cual puede recopilar datos, usar cookies o incrustar un seguimiento adicional de terceros.' },
    { title: 'Qué derechos tenés sobre tus datos', icon: 'user-check', text: 'Si tenés una cuenta en este sitio o dejaste comentarios, podés solicitar recibir un archivo de exportación de los datos personales que tenemos sobre vos, incluidos los que nos hayas proporcionado. También podés solicitar que eliminemos cualquier dato personal que tengamos sobre vos, salvo que estemos obligados a conservarlo por razones administrativas, legales o de seguridad.' }
  ];
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  componentDidUpdate() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() { return { secciones: this.secciones }; }
}

</script>
